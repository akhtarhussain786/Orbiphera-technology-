<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220" />
      <stop offset="100%" stop-color="#141D30" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8B800" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#E8B800" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Dashboard Backdrop -->
  <rect width="1200" height="750" fill="url(#bgGrad)" />

  <!-- App Header / Navigation Bar -->
  <rect x="0" y="0" width="1200" height="70" fill="#080D17" stroke="#1E293B" stroke-width="1" />
  
  <!-- Logo Mark in Header -->
  <rect x="32" y="18" width="34" height="34" rx="8" fill="#E8B800" />
  <text x="78" y="41" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" letter-spacing="0.5">YATHARTH OS</text>
  <rect x="230" y="24" width="70" height="22" rx="11" fill="#1E293B" />
  <text x="245" y="39" fill="#E8B800" font-family="monospace" font-size="11" font-weight="700">v3.4.0</text>

  <!-- Search Bar -->
  <rect x="340" y="16" width="360" height="38" rx="8" fill="#131B2E" stroke="#1E293B" stroke-width="1" />
  <text x="360" y="40" fill="#64748B" font-family="system-ui, sans-serif" font-size="13">Search deployments, logs, APIs (Cmd+K)...</text>

  <!-- User Avatar & Status -->
  <circle cx="1140" cy="35" r="18" fill="#E8B800" />
  <text x="1134" y="40" fill="#0B1220" font-family="sans-serif" font-size="14" font-weight="800">Y</text>
  <circle cx="1090" cy="35" r="6" fill="#16A34A" />

  <!-- Left Sidebar (Collapsible) -->
  <rect x="0" y="70" width="220" height="680" fill="#090E1A" stroke="#1E293B" stroke-width="1" />
  <!-- Sidebar Menu Items -->
  <g transform="translate(18, 95)" font-family="system-ui, sans-serif" font-size="13" font-weight="600">
    <rect x="0" y="0" width="184" height="38" rx="8" fill="#1E293B" />
    <circle cx="20" cy="19" r="5" fill="#E8B800" />
    <text x="38" y="24" fill="#FFFFFF">Production Overview</text>

    <text x="38" y="66" fill="#94A3B8">API Gateway</text>
    <text x="38" y="106" fill="#94A3B8">Cloud Database</text>
    <text x="38" y="146" fill="#94A3B8">Microservices</text>
    <text x="38" y="186" fill="#94A3B8">AI Model Pipeline</text>
    <text x="38" y="226" fill="#94A3B8">Security &amp; IAM</text>
    <text x="38" y="266" fill="#94A3B8">Audit Compliance</text>
  </g>

  <!-- Main Content Stage -->
  <g transform="translate(250, 95)">
    <!-- Page Title & Controls -->
    <text x="0" y="26" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="24" font-weight="800">Production Infrastructure Dashboard</text>
    <text x="0" y="50" fill="#64748B" font-family="system-ui, sans-serif" font-size="13">Real-time health, latency and API transaction throughput</text>

    <rect x="740" y="6" width="170" height="38" rx="8" fill="#E8B800" />
    <text x="765" y="30" fill="#0B1220" font-family="system-ui, sans-serif" font-size="13" font-weight="800">+ New Deployment</text>

    <!-- 4 KPI Cards -->
    <g transform="translate(0, 75)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="210" height="105" rx="12" fill="#111B2E" stroke="#1E293B" stroke-width="1" />
      <text x="18" y="28" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">API Transactions</text>
      <text x="18" y="62" fill="#FFFFFF" font-family="monospace" font-size="26" font-weight="800">42.8M</text>
      <text x="18" y="88" fill="#16A34A" font-family="system-ui, sans-serif" font-size="11" font-weight="700">↑ 18.4% vs last week</text>

      <!-- Card 2 -->
      <rect x="234" y="0" width="210" height="105" rx="12" fill="#111B2E" stroke="#1E293B" stroke-width="1" />
      <text x="252" y="28" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Avg Response Time</text>
      <text x="252" y="62" fill="#FFFFFF" font-family="monospace" font-size="26" font-weight="800">18.4ms</text>
      <text x="252" y="88" fill="#16A34A" font-family="system-ui, sans-serif" font-size="11" font-weight="700">P99 SLA Guaranteed</text>

      <!-- Card 3 -->
      <rect x="468" y="0" width="210" height="105" rx="12" fill="#111B2E" stroke="#1E293B" stroke-width="1" />
      <text x="486" y="28" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">System Availability</text>
      <text x="486" y="62" fill="#FFFFFF" font-family="monospace" font-size="26" font-weight="800">99.99%</text>
      <text x="486" y="88" fill="#16A34A" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Zero downtime recorded</text>

      <!-- Card 4 -->
      <rect x="702" y="0" width="210" height="105" rx="12" fill="#111B2E" stroke="#1E293B" stroke-width="1" />
      <text x="720" y="28" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Active Nodes</text>
      <text x="720" y="62" fill="#E8B800" font-family="monospace" font-size="26" font-weight="800">128 Cluster</text>
      <text x="720" y="88" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Multi-region distributed</text>
    </g>

    <!-- Main Chart Section -->
    <g transform="translate(0, 205)">
      <rect x="0" y="0" width="912" height="230" rx="12" fill="#111B2E" stroke="#1E293B" stroke-width="1" />
      <text x="20" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Network Throughput &amp; Cloud Workload (24 Hours)</text>
      <text x="810" y="32" fill="#E8B800" font-family="monospace" font-size="12" font-weight="700">● LIVE SYNC</text>

      <!-- Chart Grid Lines -->
      <line x1="20" y1="70" x2="890" y2="70" stroke="#1E293B" stroke-dasharray="4 4" />
      <line x1="20" y1="120" x2="890" y2="120" stroke="#1E293B" stroke-dasharray="4 4" />
      <line x1="20" y1="170" x2="890" y2="170" stroke="#1E293B" stroke-dasharray="4 4" />

      <!-- Area Path with Gold Gradient -->
      <path d="M 20 180 Q 150 150 250 110 T 500 80 T 750 60 T 890 40 L 890 210 L 20 210 Z" fill="url(#chartGrad)" />
      <!-- Line Stroke in Gold -->
      <path d="M 20 180 Q 150 150 250 110 T 500 80 T 750 60 T 890 40" fill="none" stroke="#E8B800" stroke-width="3" stroke-linecap="round" />
      
      <!-- Chart Peak Node -->
      <circle cx="750" cy="60" r="5" fill="#E8B800" />
      <circle cx="890" cy="40" r="6" fill="#FFFFFF" stroke="#E8B800" stroke-width="3" />
    </g>

    <!-- Micro Deployment Logs Table -->
    <g transform="translate(0, 455)">
      <rect x="0" y="0" width="912" height="150" rx="12" fill="#111B2E" stroke="#1E293B" stroke-width="1" />
      <text x="20" y="30" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Active Service Deployments</text>

      <!-- Row 1 -->
      <line x1="20" y1="46" x2="892" y2="46" stroke="#1E293B" />
      <circle cx="32" cy="70" r="4" fill="#16A34A" />
      <text x="48" y="74" fill="#FFFFFF" font-family="monospace" font-size="12">svc-core-banking-api</text>
      <text x="320" y="74" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Next.js 14 + Node Gateway</text>
      <text x="640" y="74" fill="#16A34A" font-family="monospace" font-size="11">DEPLOYED (0.12s)</text>
      <text x="820" y="74" fill="#64748B" font-family="monospace" font-size="11">Just now</text>

      <!-- Row 2 -->
      <line x1="20" y1="96" x2="892" y2="96" stroke="#1E293B" />
      <circle cx="32" cy="120" r="4" fill="#16A34A" />
      <text x="48" y="124" fill="#FFFFFF" font-family="monospace" font-size="12">svc-ai-analytics-engine</text>
      <text x="320" y="124" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">FastAPI + PostgreSQL Vector</text>
      <text x="640" y="124" fill="#16A34A" font-family="monospace" font-size="11">ACTIVE (14ms)</text>
      <text x="820" y="124" fill="#64748B" font-family="monospace" font-size="11">2m ago</text>
    </g>
  </g>
</svg>

